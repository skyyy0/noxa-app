# Builds NOXA as an installable APK on GitHub's own runners and publishes the
# result as a Release asset, so every push to `main` produces a permanent
# download link at:
#
#     https://github.com/<owner>/<repo>/releases/latest
#
# This is the GitHub-Actions replacement for codemagic.yaml.
#
# Works with zero configuration:
#   * a signed RELEASE APK is always built and published. The signing keystore
#     (`my-upload-key.jks`) is committed to this private repository, so every
#     build shares ONE stable signature and new versions install as in-place
#     updates over previously installed ones (from v1.8 onward).
#   * KEYSTORE_* secrets are no longer required; they are still honoured if
#     you ever want to sign with a different (e.g. hardware-backed) key.
#
# JDK 21 is required: the project compiles against Android SDK 36, and Robolectric
# refuses to emulate SDK 36 on Java 17, which would break the unit test step.
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64              base64 of your .jks release keystore
#   KEYSTORE_PASSWORD            keystore password
#   KEY_ALIAS                    key alias
#   KEY_PASSWORD                 key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of your Firebase google-services.json
#
# Create the keystore secret on Linux/macOS with:
#   base64 -w0 my-upload-key.jks   (macOS: base64 -i my-upload-key.jks)

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the workflow can publish a Release with the built APK.
permissions:
  contents: write

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `packages` must be overridden: the action's default list still contains the
      # retired legacy `tools` package, which no longer exists in the SDK repository
      # and makes the action fail with "Failed to find package 'tools'".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36.1" "build-tools;36.1.0"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Restore google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
            echo "google-services.json restored from secret."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set."
            echo "Firebase Auth / Google Sign-In will be unavailable; the app still builds and runs in guest mode."
          fi

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            {
              echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks"
              echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
              echo "SIGNED_RELEASE=true"
            } >> "${GITHUB_ENV}"
            echo "Release keystore restored; a signed release APK will be built."
          else
            echo "KEYSTORE_BASE64 is not set; the committed repository keystore will be used."
          fi

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          tag="v${version:-1.0}-build${{ github.run_number }}"
          found=0
          for apk in $(find app/build/outputs/apk -name '*.apk' -type f); do
            flavour=$(basename "$(dirname "$apk")")
            cp "$apk" "dist/noxa-${flavour}-${tag}.apk"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          ls -lh dist
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version:-1.0}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: noxa-apk-${{ steps.collect.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" dist/*.apk \
            --title "NOXA ${{ steps.collect.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Signed release APK of NOXA ${{ steps.collect.outputs.version }} built automatically from ${GITHUB_SHA}. Installing it over a previous v1.8+ build updates the app in place — no uninstall needed." \
            --latest
